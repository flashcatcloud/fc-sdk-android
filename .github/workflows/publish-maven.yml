name: Publish SDK

on:
  push:
    tags:
      - "v*" # 打正式版 tag：签名后打成 Maven 仓库 zip，挂到 GitHub Release，不发 Maven Central
  workflow_dispatch: # Actions 页面手动触发：选 tag 提交正式版到 Maven Central，选分支发快照版

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 创建 Release 并上传 zip 需要写权限
    # Bound the job so a stuck Gradle build is killed instead of running up to
    # GitHub's 6h default. Headroom is deliberate: a known-good release run has
    # taken ~52 min, and the Maven Central upload is network-bound, so a tight
    # limit would kill legitimately-slow publishes. A hang only wastes the extra
    # minutes (free on this public repo), so we err loose.
    timeout-minutes: 90

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action's default also installs the legacy `tools` package, which the
          # SDK repository no longer serves, so sdkmanager exits 1 and the job stops
          # before building. Only platform-tools is needed; Gradle fetches the rest.
          packages: platform-tools

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Build the library AARs and run unit tests, scoped to the SDK libraries.
      # We deliberately do NOT run a project-wide `assembleRelease`: that also
      # assembles every sample app (sample/* with the Us1–Us5 flavors), plus the
      # benchmark and tooling modules — none of which are published, and which
      # previously pushed this job past 2 hours.
      # `bundleReleaseAar` is an Android-library-only task, so the sample
      # application modules (which produce APK/AAB, not AAR) are skipped
      # automatically; it packages the real artifacts as a fail-fast gate before
      # publishing. `testReleaseUnitTest` compiles and tests the library release
      # sources.
      # NOTE: no `clean` here. The runner is ephemeral (fresh checkout, empty
      # build/), so clean is unnecessary; worse, running `clean` in the same
      # invocation as `testReleaseUnitTest` races with Kover and fails with
      # "kover-agent.args (No such file or directory)" as clean wipes build/tmp.
      - name: Build and test SDK library modules
        run: ./gradlew bundleReleaseAar testReleaseUnitTest --stacktrace

      - name: Stop Gradle Daemon
        run: ./gradlew --stop

      - name: Publish Maven repository zip to GitHub Release
        if: github.event_name == 'push'
        env:
          # GPG signing credentials (supports both base64 and ASCII armored)
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSWORD: ${{ secrets.GPG_PASSPHRASE }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "📦 Building signed Maven repository for ${{ github.ref_name }}"
          ./gradlew publishAllPublicationsToLocalRepoRepository --no-daemon --stacktrace

          VERSION="${GITHUB_REF_NAME#v}"
          ZIP="fc-sdk-android-${VERSION}-maven-repo.zip"
          ( cd build/maven-repo && zip -qr "../${ZIP}" . )
          ls -lh "build/${ZIP}"

          MODULES="$(ls build/maven-repo/cloud/flashcat | sed 's/.*/- `cloud.flashcat:&`/')"
          export VERSION MODULES
          # Only substitute these two, so Gradle snippets like ${rootDir} stay intact
          perl -pe 's/\$\{VERSION\}/$ENV{VERSION}/g; s/\$\{MODULES\}/$ENV{MODULES}/g' \
            .github/release-notes/maven-repo-zip.md > build/release-notes.md

          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "build/${ZIP}" --clobber
            gh release edit "${GITHUB_REF_NAME}" --notes-file build/release-notes.md
          else
            gh release create "${GITHUB_REF_NAME}" "build/${ZIP}" \
              --title "${GITHUB_REF_NAME}" \
              --notes-file build/release-notes.md
          fi

          echo "✅ ${ZIP} attached to ${GITHUB_REF_NAME}"

      - name: Publish to Maven Central
        if: github.event_name == 'workflow_dispatch'
        env:
          # Maven Central Portal credentials
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          # GPG signing credentials (supports both base64 and ASCII armored)
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSWORD: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "📦 Publishing release version to Maven Central (from tag: ${{ github.ref_name }})"
          else
            echo "📦 Publishing snapshot version to Maven Central (from branch: ${{ github.ref_name }})"
          fi

          ./gradlew publishAllPublicationsToMavenCentralRepository --no-daemon --stacktrace

          echo "✅ Publishing completed"

  notify-success:
    needs: publish
    runs-on: ubuntu-latest
    if: success()
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Determine version type
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            if [[ "${{ github.ref }}" == refs/tags/* ]]; then
              echo "type=正式版，已提交到 Maven Central（需在 Portal 手动发布）" >> $GITHUB_OUTPUT
              echo "version=${{ github.ref_name }}" >> $GITHUB_OUTPUT
            else
              echo "type=快照版，已发布到 Maven Central" >> $GITHUB_OUTPUT
              echo "version=${{ github.ref_name }}-SNAPSHOT" >> $GITHUB_OUTPUT
            fi
          else
            echo "type=正式版，Maven 仓库 zip 已挂到 GitHub Release" >> $GITHUB_OUTPUT
            echo "version=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Notify deployment success
        uses: zcong1993/actions-ding@master
        with:
          ignoreError: "true"
          dingToken: ${{ secrets.DING_TALK_TOKEN }}
          secret: ${{ secrets.DING_TALK_SECRET }}
          body: |
            {
              "msgtype": "markdown",
              "markdown": {
                "title": "fc-sdk-android 发布通知",
                "text": "### ✅ fc-sdk-android 发布成功\n\n---\n\n 🔖 版本: ${{ steps.version.outputs.version }}\n\n 📦 类型: ${{ steps.version.outputs.type }}\n\n 👨‍💻 发布者: ${{ github.actor }}\n\n 🚀 [查看详情](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})"
              }
            }

      - name: Notify secondary DingTalk group on success
        uses: zcong1993/actions-ding@master
        with:
          ignoreError: "true"
          dingToken: ${{ secrets.DING_TALK_TOKEN_2 }}
          secret: ${{ secrets.DING_TALK_SECRET_2 }}
          body: |
            {
              "msgtype": "markdown",
              "markdown": {
                "title": "fc-sdk-android 发布通知",
                "text": "### ✅ fc-sdk-android 发布成功\n\n---\n\n 🔖 版本: ${{ steps.version.outputs.version }}\n\n 📦 类型: ${{ steps.version.outputs.type }}\n\n 👨‍💻 发布者: ${{ github.actor }}\n\n 🚀 [查看详情](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})"
              }
            }

  notify-failure:
    needs: publish
    runs-on: ubuntu-latest
    if: failure()
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Determine version type
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            if [[ "${{ github.ref }}" == refs/tags/* ]]; then
              echo "type=正式版，已提交到 Maven Central（需在 Portal 手动发布）" >> $GITHUB_OUTPUT
              echo "version=${{ github.ref_name }}" >> $GITHUB_OUTPUT
            else
              echo "type=快照版，已发布到 Maven Central" >> $GITHUB_OUTPUT
              echo "version=${{ github.ref_name }}-SNAPSHOT" >> $GITHUB_OUTPUT
            fi
          else
            echo "type=正式版，Maven 仓库 zip 已挂到 GitHub Release" >> $GITHUB_OUTPUT
            echo "version=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Notify deployment failure
        uses: zcong1993/actions-ding@master
        with:
          ignoreError: "true"
          dingToken: ${{ secrets.DING_TALK_TOKEN }}
          secret: ${{ secrets.DING_TALK_SECRET }}
          body: |
            {
              "msgtype": "markdown",
              "markdown": {
                "title": "fc-sdk-android 发布通知",
                "text": "### ❌ fc-sdk-android 发布失败\n\n---\n\n 🔖 版本: ${{ steps.version.outputs.version }}\n\n 📦 类型: ${{ steps.version.outputs.type }}\n\n 👨‍💻 发布者: ${{ github.actor }}\n\n 🚀 [查看详情](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})"
              }
            }
