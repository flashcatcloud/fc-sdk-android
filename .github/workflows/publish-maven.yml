name: Publish to Maven Central

on:
  push:
    branches:
      - publish # 推送到 publish 分支时触发 snapshot 发布
    tags:
      - "v*" # 推送 tag（如 v0.1.0）时触发正式发布

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build project
        run: ./gradlew clean assembleRelease --stacktrace

      - name: Run tests
        run: ./gradlew clean testReleaseUnitTest --stacktrace

      - name: Stop Gradle Daemon
        run: ./gradlew --stop

      - name: Publish to Maven Central
        env:
          # Maven Central Portal credentials
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          # GPG signing credentials (supports both base64 and ASCII armored)
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSWORD: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          # Determine if this is a snapshot or release build
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "📦 Publishing release version (from tag: ${{ github.ref_name }})"
            VERSION_TYPE="release"
          else
            echo "📦 Publishing snapshot version (from branch: ${{ github.ref_name }})"
            VERSION_TYPE="snapshot"
          fi

          # Publish all modules using Vanniktech plugin
          # This will upload to Maven Central Portal
          ./gradlew publishAllPublicationsToMavenCentralRepository --no-daemon --stacktrace

          echo "✅ Publishing completed"

      - name: Notify on success
        if: success()
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "✅ Released ${{ github.ref_name }} to Maven Central"
            echo "⚠️  Next step: Manually publish in Central Portal:"
            echo "   https://central.sonatype.com/publishing/deployments"
          else
            echo "✅ Published snapshot from ${{ github.ref_name }} branch"
            echo "📍 Snapshot repository: https://central.sonatype.com/repository/maven-snapshots/"
          fi

      - name: Notify on failure
        if: failure()
        run: |
          echo "❌ Publishing failed. Check logs for details."
          echo "Common issues:"
          echo "  - GPG key not properly configured"
          echo "  - Maven Central credentials incorrect"
          echo "  - Build or test failures"
