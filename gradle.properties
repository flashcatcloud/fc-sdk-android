org.gradle.jvmargs=-Xmx4096m
android.useAndroidX=true
android.experimental.enableTestFixturesKotlinSupport=true
org.jetbrains.dokka.experimental.gradle.pluginMode=V2Enabled
org.jetbrains.dokka.experimental.gradle.pluginMode.noWarn=true

# Allows Kotlin with target JVM compat 17 to be built on JDK 21
kotlin.jvm.target.validation.mode = IGNORE

# Maven Publishing Configuration
# Maven Central credentials (set via environment variables in CI):
# - mavenCentralUsername: Your Central Portal token username
# - mavenCentralPassword: Your Central Portal token password

# GPG Signing Configuration (set via environment variables in CI):
# For in-memory signing (recommended for CI/CD):
# - signingInMemoryKey: ASCII-armored GPG private key
# - signingInMemoryKeyPassword: GPG key passphrase
#
# For file-based signing (local development):
# - signing.keyId: Last 8 chars of your GPG key ID
# - signing.password: GPG key passphrase
# - signing.secretKeyRingFile: Path to secring.gpg file
#
# Note: Vanniktech plugin handles signing automatically via standard Gradle properties

# Leave the next line blank for CI
